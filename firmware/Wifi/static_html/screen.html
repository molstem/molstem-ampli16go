async function loadFont() {
  const bin = atob(FONT_B64);
  const buf = new ArrayBuffer(bin.length);
  const view = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
  loadedFont = opentype.parse(buf);
  render();
}

loadFont().then(() => {
  const host = location.hostname || "192.168.4.1";
  document.getElementById("ipInput").value = host;
  connectWs();
});

document.getElementById("renderBtn").addEventListener("click", render);
document.getElementById("downloadBtn").addEventListener("click", downloadSvg);
document.getElementById("connectBtn").addEventListener("click", connectWs);
document.getElementById("disconnectBtn").addEventListener("click", disconnectWs);

function setWsStatus(text, cls) {
  const el = document.getElementById("wsStatus");
  el.textContent = text;
  el.className = cls || "";
}

function connectWs() {
  disconnectWs();
  const ip = document.getElementById("ipInput").value.trim();
  if (!ip) return;

  setWsStatus("Connecting...");
  ws = new WebSocket("ws://" + ip + "/screen-ws");

  ws.onopen = function() {
    setWsStatus("Connected", "connected");
    document.getElementById("connectBtn").disabled = true;
    document.getElementById("disconnectBtn").disabled = false;
  };

  ws.onmessage = function(ev) {
    document.getElementById("textInput").value = ev.data;
    render();
  };

  ws.onclose = function() {
    setWsStatus("Disconnected");
    document.getElementById("connectBtn").disabled = false;
    document.getElementById("disconnectBtn").disabled = true;
    ws = null;
  };

  ws.onerror = function() {
    setWsStatus("Error", "error");
  };
}

function disconnectWs() {
  if (ws) {
    ws.close();
    ws = null;
  }
}

function sendCmd(cmd) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(new Uint8Array([cmd]));
  }
}

document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowUp") { sendCmd(0); e.preventDefault(); }
  else if (e.key === "ArrowDown") { sendCmd(1); e.preventDefault(); }
  else if (e.key === "Enter") { sendCmd(2); e.preventDefault(); }
});

function render() {
  if (!loadedFont) return;

  const svg = document.getElementById("lcdSvg");
  svg.innerHTML = "";

  const lines = normalizeText(
    document.getElementById("textInput").value
  );

  const lcdW = COLS * CELL_W + PADDING * 2;
  const lcdH = ROWS * CELL_H + PADDING * 2;
  const width = lcdW + (FRAME + BEZEL) * 2;
  const height = lcdH + (FRAME + BEZEL) * 2;

  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  /* PCB frame (green) */
  svg.innerHTML += `
    <rect x="0" y="0" width="${width}" height="${height}"
          rx="${CORNER_R}" ry="${CORNER_R}" fill="#000000" />
  `;

  /* Metallic bezel */
  svg.innerHTML += `
    <rect x="${FRAME}" y="${FRAME}"
          width="${lcdW + BEZEL * 2}" height="${lcdH + BEZEL * 2}"
          rx="2" ry="2" fill="#707070" />
  `;

  /* LCD glass background */
  const lcdX = FRAME + BEZEL;
  const lcdY = FRAME + BEZEL;
  svg.innerHTML += `
    <rect x="${lcdX}" y="${lcdY}" width="${lcdW}" height="${lcdH}"
          fill="#1a0a00" />
  `;

  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const ch = lines[row][col];

      const x = lcdX + PADDING + col * CELL_W;
      const y = lcdY + PADDING + row * CELL_H + BASELINE;

      const glyph = loadedFont.charToGlyph(ch);
      const path = glyph.getPath(x, y, FONT_SIZE);

      svg.innerHTML += `
        <path d="${path.toPathData()}" fill="#f0a030"/>
      `;
    }
  }

  document.getElementById("downloadBtn").disabled = false;
}

function normalizeText(text) {
  const lines = text.split("\n").slice(0, ROWS);

  while (lines.length < ROWS) lines.push("");

  return lines.map(line =>
    (line.padEnd(COLS, " ")).slice(0, COLS)
  );
}

function downloadSvg() {
  const svg = document.getElementById("lcdSvg");
  const data = new XMLSerializer().serializeToString(svg);
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(data);

  const a = document.createElement("a");
  a.href = url;
  a.download = "hd44780_20x4.svg";
  a.click();
}
</script>
