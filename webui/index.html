<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a0c" />
    <title>molstem thermocycler</title>
    <!-- fonts:molstem (stripped from the embedded/offline build) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
    <!-- /fonts:molstem -->
    <style>
      .loading-container{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:#070a0c;color:#b9b5ab}
      .spinner{width:40px;height:40px;border:3px solid rgba(236,232,223,0.12);border-top-color:#5fe3c8;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .loading-text{margin-top:16px;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
