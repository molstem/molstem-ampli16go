      #     sudo wget -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/jammy/winehq-jammy.sources
      #     sudo apt-get update
      #     sudo apt-get install -y --install-recommends winehq-stable
      #
      # - name: Build Electron apps for all platforms
      #   run: |
      #     cd webui
      #     npm run electron:build -- --win --mac --linux
      #     ls -lh electron-dist/
      #
      # - name: Upload Windows Desktop App
      #   if: github.ref == 'refs/heads/main'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ env.PRODUCT }}-${{ steps.git-describe.outputs.version }}-windows
      #     path: webui/electron-dist/win-unpacked
      #
      # - name: Upload macOS Desktop App
      #   if: github.ref == 'refs/heads/main'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ env.PRODUCT }}-${{ steps.git-describe.outputs.version }}-macos
      #     path: webui/electron-dist/mac/
      #
      # - name: Upload Linux Desktop App
      #   if: github.ref == 'refs/heads/main'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ env.PRODUCT }}-${{ steps.git-describe.outputs.version }}-linux
      #     path: webui/electron-dist/linux-unpacked

      - name: Upload web app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-webapp-${{ steps.git-describe.outputs.version }}
          path: webui/dist
          retention-days: 7
